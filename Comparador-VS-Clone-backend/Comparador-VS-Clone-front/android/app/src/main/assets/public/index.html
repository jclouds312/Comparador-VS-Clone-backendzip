<!DOCTYPE html><html><head><meta charset="UTF-8"><title>SOFTGAN</title><style>
        body { margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; background: #1a1a1a; color: white; }
        .loader { border: 4px solid #333; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn-bt { margin-top: 20px; padding: 12px 24px; background: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style></head><body>
    <div style="text-align: center;">
        <div class="loader" style="margin: 0 auto 20px;"></div>
        <p>Iniciando Sistema de Medición SOFTGAN...</p>
        <button class="btn-bt" onclick="window.location.href='https://android-softgan.base44.app/PanelVendedoras'">Cargar Panel de Ventas</button>
        <div id="bt-status" style="margin-top: 15px; font-size: 0.9em; color: #3498db;">Módulo Bluetooth Activo</div>
    </div>
</body></html>
